name: liqu-be-bnb
services:
  be-bnb:
    container_name: be-bnb
    build: .
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_PORT=8000
      - APP_HOST=0.0.0.0
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - INDEXER_GQL_URL=${INDEXER_GQL_URL}
    depends_on:
      postgres-bnb:
        condition: service_healthy
    restart: unless-stopped

  postgres-bnb:
    container_name: postgres-bnb
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liquprop
      POSTGRES_USER: liquprop
      POSTGRES_PASSWORD: liquprop
    ports:
      - "5121:5432"
    volumes:
      - be_pg_data_bnb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquprop"]
      interval: 5s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  be_pg_data_bnb: