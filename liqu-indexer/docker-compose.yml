name: liqu-indexer-bnb

services:
  db-indexer-bnb:
    container_name: db-indexer-bnb
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ponder
      POSTGRES_PASSWORD: ponder
      POSTGRES_DB: ponder
    # ports:
    #   - "5345:5432"   # host 5340 → container 5432 (avoids conflict with local postgres)
    volumes:
      - indexer_pg_data_bnb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponder -d ponder"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  indexer:
    container_name: indexer-bnb
    build: .
    restart: unless-stopped
    depends_on:
      db-indexer-bnb:
        condition: service_healthy
    ports:
      - "60601:42069"
    environment:
      DATABASE_URL: postgresql://ponder:ponder@db-indexer-bnb:5432/ponder
      PONDER_RPC_URL_1: ${PONDER_RPC_URL_1}
      PONDER_RPC_URL_97: ${PONDER_RPC_URL_97}
      CH_PT: ${CH_PT}
      CH_ASSET: ${CH_ASSET}
      SWAP_ROUTER_PT_BSC_TESTNET: ${SWAP_ROUTER_PT_BSC_TESTNET}
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  indexer_pg_data_bnb:
